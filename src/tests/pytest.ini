[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short

filterwarnings =
    error
    ignore::DeprecationWarning

markers =
    unit: Pruebas unitarias.
    integration: Pruebas de integración.
    sqlite: Funcionalidad específica de SQLite.
    geopackage: Funcionalidad específica de GeoPackage.
    spatialite: Funcionalidad específica de SpatiaLite.
    postgis: Funcionalidad específica de PostGIS.
    geometry: Operaciones geométricas.
    performance: Pruebas de rendimiento.
